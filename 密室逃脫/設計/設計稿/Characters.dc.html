<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>隔代房間 人物設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A1E16}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 40px 48px; background: #F3F1EC; color: #1E1E1E; font-family: 'Noto Sans TC', sans-serif; display: flex; gap: 32px">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 900">人物設定</h1>
      <span style="font-size: 15px; color: #555555">低多邊形・大頭身・用帽子與衣服顏色分辨玩家</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; flex: 1">

      <div style="background: #FFF6E4; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="170" height="300" viewBox="0 0 200 330" role="img" aria-label="小傑：反戴黃色棒球帽、紅色上衣、牛仔褲">
          <polygon points="76,250 98,250 96,318 72,318" fill="#3F5A7A"/><polygon points="102,250 124,250 128,318 104,318" fill="#35506E"/>
          <polygon points="66,318 98,318 98,330 62,330" fill="#2A2A2A"/><polygon points="102,318 134,318 138,330 102,330" fill="#2A2A2A"/>
          <polygon points="66,160 134,160 140,256 60,256" fill="#C9473A"/><polygon points="100,160 134,160 140,256 100,256" fill="#B03C31"/>
          <polygon points="66,164 48,232 62,236 74,190" fill="#C9473A"/><polygon points="134,164 152,232 138,236 126,190" fill="#B03C31"/>
          <polygon points="48,232 62,236 60,250 46,246" fill="#F0C9A0"/><polygon points="152,232 138,236 140,250 154,246" fill="#E0B489"/>
          <polygon points="58,90 100,62 142,90 140,140 100,164 60,140" fill="#F0C9A0"/><polygon points="100,62 142,90 140,140 100,164" fill="#E0B489"/>
          <polygon points="54,92 100,52 146,92 128,84 100,74 72,84" fill="#F2B84B"/><polygon points="100,52 146,92 128,84 100,74" fill="#D9A23C"/>
          <polygon points="54,92 30,98 60,104" fill="#D9A23C"/>
          <polygon points="80,112 90,112 90,122 80,122" fill="#2A1E16"/><polygon points="110,112 120,112 120,122 110,122" fill="#2A1E16"/>
        </svg>
        <span style="font-size: 18px; font-weight: 700">小傑</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #2A1E16; background: #F2B84B; border-radius: 6px; padding: 2px 8px">1990</span>
        <span style="font-size: 13px; color: #555555; text-align: center; line-height: 1.5">反戴棒球帽<br>紅上衣・牛仔褲</span>
      </div>

      <div style="background: #FFF6E4; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="170" height="300" viewBox="0 0 200 330" role="img" aria-label="阿凱：綠色風衣、卡其短褲、短刺頭">
          <polygon points="76,250 98,250 96,286 74,286" fill="#C2A878"/><polygon points="102,250 124,250 126,286 104,286" fill="#B09768"/>
          <polygon points="78,286 94,286 94,318 78,318" fill="#E0B489"/><polygon points="106,286 122,286 122,318 106,318" fill="#D4A87E"/>
          <polygon points="70,318 98,318 98,330 66,330" fill="#F4F4F4"/><polygon points="102,318 130,318 134,330 102,330" fill="#E2E2E2"/>
          <polygon points="64,160 136,160 142,258 58,258" fill="#4E7A3A"/><polygon points="100,160 136,160 142,258 100,258" fill="#416A30"/>
          <line x1="100" y1="168" x2="100" y2="256" stroke="#2E4B22" stroke-width="3"/>
          <polygon points="64,164 46,234 60,238 72,190" fill="#4E7A3A"/><polygon points="136,164 154,234 140,238 128,190" fill="#416A30"/>
          <polygon points="46,234 60,238 58,252 44,248" fill="#E0B489"/><polygon points="154,234 140,238 142,252 156,248" fill="#D4A87E"/>
          <polygon points="58,90 100,62 142,90 140,140 100,164 60,140" fill="#E0B489"/><polygon points="100,62 142,90 140,140 100,164" fill="#D4A87E"/>
          <polygon points="58,94 64,64 76,78 84,54 96,72 106,50 116,72 128,56 134,78 142,94 100,76" fill="#2A1E16"/>
          <polygon points="80,112 90,112 90,122 80,122" fill="#2A1E16"/><polygon points="110,112 120,112 120,122 110,122" fill="#2A1E16"/>
        </svg>
        <span style="font-size: 18px; font-weight: 700">阿凱</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #2A1E16; background: #F2B84B; border-radius: 6px; padding: 2px 8px">1990</span>
        <span style="font-size: 13px; color: #555555; text-align: center; line-height: 1.5">綠色風衣・卡其短褲<br>白布鞋</span>
      </div>

      <div style="background: #E3EEF0; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="170" height="300" viewBox="0 0 200 330" role="img" aria-label="小雨：白色連帽衣、青綠色耳機、灰色運動褲">
          <polygon points="76,250 98,250 96,318 72,318" fill="#8A969B"/><polygon points="102,250 124,250 128,318 104,318" fill="#7A868B"/>
          <polygon points="66,318 98,318 98,330 62,330" fill="#5CC8D0"/><polygon points="102,318 134,318 138,330 102,330" fill="#4AB0B8"/>
          <polygon points="64,158 136,158 142,256 58,256" fill="#EEF3F4"/><polygon points="100,158 136,158 142,256 100,256" fill="#DCE5E7"/>
          <polygon points="84,200 116,200 118,226 82,226" fill="#C9D6DA"/>
          <polygon points="64,162 46,232 60,236 72,188" fill="#EEF3F4"/><polygon points="136,162 154,232 140,236 128,188" fill="#DCE5E7"/>
          <polygon points="46,232 60,236 58,250 44,246" fill="#C99A72"/><polygon points="154,232 140,236 142,250 156,246" fill="#B9895F"/>
          <polygon points="58,90 100,62 142,90 140,140 100,164 60,140" fill="#C99A72"/><polygon points="100,62 142,90 140,140 100,164" fill="#B9895F"/>
          <polygon points="54,100 60,70 100,48 140,70 146,100 146,150 134,150 136,96 100,74 64,96 66,150 54,150" fill="#3B2A28"/>
          <polygon points="44,96 58,90 60,128 46,132" fill="#5CC8D0"/><polygon points="156,96 142,90 140,128 154,132" fill="#4AB0B8"/>
          <path d="M52 92 Q 100 30 148 92" stroke="#2C3A40" stroke-width="5" fill="none"/>
          <polygon points="80,112 90,112 90,122 80,122" fill="#2A1E16"/><polygon points="110,112 120,112 120,122 110,122" fill="#2A1E16"/>
        </svg>
        <span style="font-size: 18px; font-weight: 700">小雨</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #0F2A33; background: #5CC8D0; border-radius: 6px; padding: 2px 8px">2030</span>
        <span style="font-size: 13px; color: #555555; text-align: center; line-height: 1.5">白色連帽衣・耳機<br>灰色運動褲</span>
      </div>

      <div style="background: #E3EEF0; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="170" height="300" viewBox="0 0 200 330" role="img" aria-label="阿哲：深藍外套帶青綠色光條、透明護目鏡">
          <polygon points="76,250 98,250 96,318 72,318" fill="#2C3A40"/><polygon points="102,250 124,250 128,318 104,318" fill="#253238"/>
          <polygon points="66,318 98,318 98,330 62,330" fill="#EEF3F4"/><polygon points="102,318 134,318 138,330 102,330" fill="#DCE5E7"/>
          <polygon points="64,158 136,158 142,256 58,256" fill="#1F3A4D"/><polygon points="100,158 136,158 142,256 100,256" fill="#1A3242"/>
          <polygon points="70,190 130,190 130,196 70,196" fill="#5CC8D0"/>
          <polygon points="64,162 46,232 60,236 72,188" fill="#1F3A4D"/><polygon points="136,162 154,232 140,236 128,188" fill="#1A3242"/>
          <polygon points="46,232 60,236 58,250 44,246" fill="#F0C9A0"/><polygon points="154,232 140,236 142,250 156,246" fill="#E0B489"/>
          <polygon points="58,90 100,62 142,90 140,140 100,164 60,140" fill="#F0C9A0"/><polygon points="100,62 142,90 140,140 100,164" fill="#E0B489"/>
          <polygon points="58,92 100,56 142,92 132,82 100,70 68,82" fill="#4A4A4A"/>
          <polygon points="66,104 134,104 130,126 70,126" fill="#8FE0E6" opacity="0.75"/>
          <line x1="66" y1="104" x2="134" y2="104" stroke="#2C3A40" stroke-width="3"/>
        </svg>
        <span style="font-size: 18px; font-weight: 700">阿哲</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #0F2A33; background: #5CC8D0; border-radius: 6px; padding: 2px 8px">2030</span>
        <span style="font-size: 13px; color: #555555; text-align: center; line-height: 1.5">深藍外套・光條<br>透明護目鏡</span>
      </div>
    </div>
  </div>

  <div style="width: 300px; flex: none; background: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 900">建模規格</h2>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #555555">面數</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.6">每個角色 600–1,000 個三角面，手機也跑得動</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #555555">比例</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.6">頭身比約 1 : 2，身高 1.6 單位，頭佔 40%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #555555">骨架</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.6">頭、身體、雙手、雙腳分開的零件，用簡單旋轉做走路、搬東西、揮手</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #555555">材質</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.6">平塗色、不用貼圖；每個面一個顏色，暗面用同色深一階</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #555555">年代配色</span>
      <div style="display: flex; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #F2B84B"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #C9473A"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #4E7A3A"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #8C5E3A"></div>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; align-self: center">1990</span>
      </div>
      <div style="display: flex; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #5CC8D0"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #EEF3F4; box-shadow: inset 0 0 0 1px #C9D6DA"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #1F3A4D"></div>
        <div style="width: 30px; height: 30px; border-radius: 8px; background: #8A969B"></div>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; align-self: center">2030</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
